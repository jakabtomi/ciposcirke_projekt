<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rákillió – a ritka válasz játéka</title>
<style>
:root{--d:0;--fg:#eaf6ff;--muted:#8fb4cc;--card:rgba(6,30,52,.78);--line:#1f5278;--accent:#35c4ff;--ok:#3ddc97;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{color:var(--fg);font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#2aa9e0 0%,#0b5d94 25%,#06304f 55%,#020d1c 100%);background-attachment:fixed;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.dim{position:fixed;inset:0;background:#000;opacity:calc(var(--d)*.55);pointer-events:none;transition:opacity .2s}
.bub{display:none}
@keyframes rise{to{transform:translateY(-110vh)}}
.gauge{position:fixed;right:14px;top:70px;bottom:24px;width:34px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2}
.gauge .track{flex:1;width:8px;border-radius:8px;background:#ffffff22;position:relative;overflow:hidden}
.gauge .fill{position:absolute;top:0;left:0;right:0;height:0;background:linear-gradient(#7fe3ff,#35c4ff);border-radius:8px;transition:height .15s}
.gauge small{font-size:.7rem;color:var(--muted);writing-mode:vertical-rl}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:22px 64px 40px 18px}
header{text-align:center;margin-bottom:18px}
header h1{font-size:clamp(2rem,6vw,2.8rem);letter-spacing:-.03em}
header em{font-style:normal;color:var(--accent)}
header p{color:var(--muted);margin-top:4px;font-size:.92rem}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;padding:24px}
.card h2{font-size:1.45rem;line-height:1.3;margin:10px 0 18px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem}
.timer{height:6px;border-radius:6px;background:#ffffff1f;margin-top:8px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--accent)}
.timer i.low{background:var(--bad)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#031425;color:var(--fg)}
input:focus{outline:2px solid var(--accent)}
.btn{background:var(--accent);color:#03233a;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:1rem}
.btn.ghost{background:#0c3556;color:var(--fg);font-weight:500}
.btn:hover{filter:brightness(1.1)}
.tiers{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.tier{font-size:.72rem;padding:3px 9px;border-radius:999px;background:#0c3556;color:var(--muted)}
.res{text-align:center;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.res .big{font-size:2.6rem;font-weight:800;margin:6px 0}
.badge{display:inline-block;padding:5px 16px;border-radius:999px;font-weight:700}
.res p{color:var(--muted);margin:8px 0 18px}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:14px 0}
td,th{padding:7px 4px;border-bottom:1px solid #1f527855;text-align:left}
th{color:var(--muted);font-weight:500;font-size:.75rem}
.center{text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--accent)}
.hint{color:var(--muted);font-size:.8rem;margin-top:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.mpnote{font-size:.82rem;color:var(--muted);background:#03142588;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0;line-height:1.5}
.codebig{font-size:2.6rem;font-weight:800;letter-spacing:.25em;color:var(--accent);text-align:center;margin:6px 0}
.plist{display:grid;gap:8px;margin:14px 0}
.pl{display:flex;align-items:center;gap:12px;background:#031425aa;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.pl b{flex:1}
.tag{font-size:.7rem;padding:2px 8px;border-radius:999px;background:#0c3556;color:var(--muted)}
.ringw{position:relative;height:300px;margin:6px 0 4px}
.seat{position:absolute;transform:translate(-50%,-50%);text-align:center;width:92px;transition:transform .25s,opacity .25s;font-size:.78rem}
.seat.act{filter:drop-shadow(0 0 10px #ffd166);transform:translate(-50%,-50%) scale(1.14)}
.seat.dead{opacity:.3;filter:grayscale(1)}
.seat .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.puff{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:1;animation:pump 1.2s ease-in-out infinite;animation-duration:var(--pp,1.2s)}
@keyframes pump{50%{transform:translate(-50%,-50%) scale(1.12)}}
.used{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.used span{font-size:.78rem;background:#0c3556;border-radius:999px;padding:3px 10px}
.evl{min-height:1.6em;text-align:center;margin:6px 0 10px}
.badmsg{min-height:1.4em;margin-top:10px;color:var(--bad);font-size:.92rem}
.shake{animation:shk .35s;border-color:var(--bad)}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.score.big{font-size:4.8rem;line-height:1;font-weight:800;color:#fff}
.pts{color:var(--accent);margin:4px 0 6px;font-size:1rem;letter-spacing:.04em}
.perf{margin:16px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:#03142588}
.perf h3{font-size:1.05rem}
.pmsg{margin:4px 0 10px}
.cmp{display:grid;grid-template-columns:50px 1fr 80px;gap:8px;align-items:center;font-size:.88rem;margin:4px 0}
.ct{height:12px;background:#ffffff1c;border-radius:8px;overflow:hidden}
.ct i{display:block;height:100%;border-radius:8px}
.cmp b{text-align:right}
.perf svg{margin-top:10px}
.stage{position:relative;height:170px;border-radius:16px;overflow:hidden;margin-bottom:14px;background:linear-gradient(#0b5d9455,#02101f88);border:1px solid var(--line)}
.stage .lines{position:absolute;inset:0;background-image:linear-gradient(to bottom,transparent 59px,#ffffff2e 59px);background-size:100% 60px}
.stage .diver{position:absolute;left:50%;top:50%;margin:-24px 0 0 -42px;line-height:0;will-change:transform;filter:drop-shadow(0 4px 8px #0008)}
.stage .dcount{position:absolute;right:12px;top:8px;font-weight:800;font-size:1.3rem;text-shadow:0 2px 6px #000a}
.stage .bubs i{position:absolute;left:38%;top:50%;width:8px;height:8px;border:1px solid #fff9;border-radius:50%;animation:bubup 1.2s linear infinite}
.stage .bubs i:nth-child(2){animation-delay:.3s;left:34%}
.stage .bubs i:nth-child(3){animation-delay:.6s;left:36%}
.stage .bubs i:nth-child(4){animation-delay:.9s;left:32%}
@keyframes bubup{from{transform:translateY(0);opacity:.9}to{transform:translateY(-90px);opacity:0}}
@media(max-width:480px){.wrap{padding-right:56px}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){.bub{display:none}}
body{background:linear-gradient(180deg,#5fd0ff 0%,#1b8ccf 14%,#0b5d94 32%,#06304f 58%,#020d1c 100%);background-attachment:fixed}
body.inmenu #home{display:none}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.sunglow{position:fixed;top:-130px;left:50%;width:560px;height:360px;margin-left:-280px;background:radial-gradient(closest-side,#fff7c2cc,#ffe08a55 45%,transparent);opacity:calc(1 - var(--d)*1.8);pointer-events:none}
.kelp{position:fixed;left:0;right:0;bottom:0;width:100%;height:130px;pointer-events:none;opacity:calc(.15 + var(--d)*.6)}
.kelp path{fill:#04283f;transform-origin:50% 100%;transform-box:fill-box;animation:sway 5s ease-in-out infinite}
.kelp path:nth-child(2n){animation-duration:6.5s;animation-delay:-2s}
.kelp path:nth-child(3n){animation-duration:4.2s;animation-delay:-1s;fill:#06344f}
@keyframes sway{50%{transform:skewX(7deg)}0%,100%{transform:skewX(-7deg)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:5;animation:fl 1s ease-out forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
.gauge,.wrap{position:relative}
.gauge{position:fixed}
header em{background:linear-gradient(90deg,#7fe3ff,#ffffff,#35c4ff,#7fe3ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
@keyframes shim{to{background-position:300% 0}}
.card{border-color:#2a6fa3;box-shadow:0 24px 70px #0008,inset 0 1px 0 #ffffff26}
.btn{transition:transform .12s,filter .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px #35c4ff33}
.btn:active{transform:translateY(1px)}
.stage{height:200px;box-shadow:inset 0 0 40px #0008}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .diver{margin:-26px 0 0 -48px}
.stage .diver .prop{transform-box:fill-box;transform-origin:center;animation:prop .16s linear infinite}
@keyframes prop{50%{transform:scaleY(.25)}}
.stage .dcount{font-size:1.6rem}
.stage .lines,.stage .bubs{display:none}
.sug{display:none}
.sug.on{display:block;margin:0 0 12px;padding:10px 12px;border:1px solid var(--accent);border-radius:12px;background:#0a3a5c99;animation:pop .3s ease}
.sug b{color:#fff}
.archive{max-height:320px;overflow:auto;display:grid;gap:6px;padding-right:4px}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#031425aa;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem}
.arow em{font-style:normal;font-size:.7rem;background:var(--accent);color:#03233a;border-radius:999px;padding:1px 7px;margin-left:4px}
.arow .btn{padding:6px 12px;font-size:.82rem}
@media(prefers-reduced-motion:reduce){.kelp path,header em,.stage .diver .prop{animation:none}}
</style>
</head>

    var getName = function () { var v = cleanName(document.getElementById("mpname").value); try { localStorage.setItem("melyviz:name", v); } catch (e) {} MP.name = v; };
    document.getElementById("mpcreate").onclick = function () {
      getName(); var c = "";
      for (var i = 0; i < 4; i++) c += ALPHA.charAt(Math.floor(Math.random() * ALPHA.length));
      mpConnect(c, true);
    };
    document.getElementById("mpjoin").onclick = function () {
      getName();
      var c = document.getElementById("mpcode").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
      if (c.length < 4) { document.getElementById("mpmsg").textContent = "Írd be a 4 karakteres szobakódot."; return; }
      mpConnect(c, false);
    };
    document.getElementById("mpback").onclick = start;
  }

  async function mpConnect(code, asHost) {
    var msg = document.getElementById("mpmsg");
    msg.style.color = "var(--muted)"; msg.textContent = "Csatlakozás…";
    var R = null;
    try { R = window.claude && window.claude.use ? await window.claude.use("room") : null; } catch (e) {}
    if (!R) { msg.style.color = "var(--bad)"; msg.textContent = "A többjátékos mód itt nem érhető el. Nyisd meg az oldalt bejelentkezve, a megosztott linken."; return; }
    var room;
    try { room = await R.join("mv-" + code); }
    catch (e) { msg.style.color = "var(--bad)"; msg.textContent = "Nem sikerült csatlakozni (" + (e && e.code ? e.code : "hiba") + ")."; return; }
    MP.room = room; MP.host = asHost; MP.code = code.toUpperCase(); MP.dead = false; MP.me = null; MP.hostPeer = null; MP.sig = ""; MP.waitFail = false; MP.joinAt = Date.now();
    MP.S = asHost ? { code: MP.code, host: null, phase: "lobby", players: [], round: 0, prompt: "", used: [], pass: 0, tl: 0, tm: 0, wait: false, win: null, ev: null } : null;
    var onErr = function () {};
    MP.unsubs.push(room.on("hello", onHello, onErr), room.on("ans", onAns, onErr), room.on("st", onSt, onErr), room.onPeers(onPeers, onErr));
    var hello = function () {
      if (MP.dead) return;
      if (MP.S && MP.S.phase !== "lobby") return;
      if (MP.S && MP.S.players.some(function (p) { return p.id === MP.me; })) return;
      room.emit("hello", { n: MP.name }).catch(function () {});
    };
    hello(); MP.t.push(setInterval(hello, 1500));
    if (asHost) MP.t.push(setInterval(broadcast, 1000));
    MP.t.push(setInterval(tick, 150));
    mpRender();
  }

  /* ---- hálózat ---- */
  function onHello(m) {
    if (MP.dead) return;
    if (m.sameTab) MP.me = m.peer;
    if (!MP.host) return;
    var S = MP.S;
    if (S.phase !== "lobby" || S.players.some(function (p) { return p.id === m.peer; }) || S.players.length >= SEATS) return;
    var pl = { id: m.peer, name: cleanName(m.data && m.data.n), lives: LIVES, col: "" };
    if (m.sameTab) { S.host = m.peer; S.players.unshift(pl); } else S.players.push(pl);
    S.players.forEach(function (p, i) { p.col = COLS[i % COLS.length]; });
    broadcast();
  }
  function onSt(m) {
    if (MP.dead || MP.host) return;
    var d = m.data;
    if (!d || d.code !== MP.code || !Array.isArray(d.players) || !Array.isArray(d.used)) return;
    if (MP.hostPeer && m.peer !== MP.hostPeer) return;
    MP.hostPeer = m.peer; MP.S = d; MP.recvAt = performance.now();
    mpRender();
  }
  function onAns(m) {
    if (MP.dead || !MP.host) return;
    var S = MP.S;
    if (S.phase !== "play" || S.wait) return;
    var cur = S.players[S.turn];
    if (!cur || cur.id !== m.peer) return;
    var text = String((m.data && m.data.t) || "").slice(0, 40);
    if (!norm(text)) return;
    var h = findAnswer(MP.q, text);
    if (!h) { S.ev = { n: ++MP.evn, k: "bad", pid: m.peer, t: text.slice(0, 20) }; broadcast(); return; }
    if (S.used.indexOf(h[0]) >= 0) { S.ev = { n: ++MP.evn, k: "dup", pid: m.peer, t: h[0] }; broadcast(); return; }
    S.used.push(h[0]);
    var t = tierOf(h[1]);
    S.ev = { n: ++MP.evn, k: "ok", pid: m.peer, t: h[0], tier: t.name, ico: t.ico };
    S.pass++; S.turn = nextAlive(S.turn);
    startTurn();
  }
  function onPeers(ch) {
    if (MP.dead || !MP.S || !ch.left.length) return;
    var S = MP.S, changed = false;
    ch.left.forEach(function (pe) {
      if (pe.isMe) return;
      if (!MP.host) {
        if (MP.hostPeer && pe.peer === MP.hostPeer) { mpLeave(); mpMenu("A host kilépett, a szoba megszűnt."); }
        return;
      }
      var i = -1;
      S.players.forEach(function (p, k) { if (p.id === pe.peer) i = k; });
      if (i < 0) return;
      changed = true;
      if (S.phase === "lobby") { S.players.splice(i, 1); S.players.forEach(function (p, k) { p.col = COLS[k % COLS.length]; }); }
      else if (S.phase === "play") {
        S.players[i].lives = 0;
        var alive = S.players.filter(function (p) { return p.lives > 0; });
        if (alive.length <= 1) { clearTimeout(MP.tt); S.phase = "end"; S.win = alive[0] ? alive[0].id : null; }
        else if (S.turn === i && !S.wait) { S.turn = nextAlive(i); startTurn(); return; }
      }
    });
    if (changed && !MP.dead) broadcast();
  }
  function broadcast() {
    if (MP.dead || !MP.host || !MP.room) return;
    var S = MP.S;
    S.tl = (S.phase === "play" && !S.wait) ? Math.max(0, MP.deadline - Date.now()) : 0;
    MP.recvAt = performance.now();
    MP.room.emit("st", S).catch(function () {});
    mpRender();
  }

  /* ---- játékmenet (csak a host futtatja) ---- */
  function nextAlive(i) { var S = MP.S, n = S.players.length; for (var k = 1; k <= n; k++) { var j = (i + k) % n; if (S.players[j].lives > 0) return j; } return i; }
  function firstAlive(i) { return MP.S.players[i].lives > 0 ? i : nextAlive(i); }
  function hostStart() {
    var S = MP.S;
    if (!MP.host || S.phase !== "lobby" || S.players.length < 2) return;
    S.players.forEach(function (p) { p.lives = LIVES; });
    MP.deck = Q.map(function (_, i) { return i; }).sort(function () { return Math.random() - 0.5; }); MP.di = 0;
    S.round = 0; S.win = null; S.ev = null; S.phase = "play"; S.turn = 0;
    newRound(0);
  }
  function hostReset() {
    var S = MP.S; clearTimeout(MP.tt);
    S.phase = "lobby"; S.win = null; S.ev = null; S.wait = false;
    S.players.forEach(function (p) { p.lives = LIVES; });
    broadcast();
  }
  function newRound(from) {
    var S = MP.S;
    MP.q = Q[MP.deck[MP.di++ % MP.deck.length]];
    S.round++; S.prompt = MP.q.p; S.used = []; S.pass = 0; S.wait = false;
    S.turn = firstAlive(from);
    startTurn();
  }
  function startTurn() {
    var S = MP.S;
    S.tm = Math.max(6000, 14000 - 600 * S.pass);
    MP.deadline = Date.now() + S.tm;
    clearTimeout(MP.tt); MP.tt = setTimeout(onTimeout, S.tm + 80);
    broadcast();
  }
  function onTimeout() {
    var S = MP.S;
    if (MP.dead || S.phase !== "play" || S.wait) return;
    var cur = S.players[S.turn]; cur.lives--;
    S.ev = { n: ++MP.evn, k: "boom", pid: cur.id, t: cur.name, out: cur.lives <= 0 };
    S.wait = true;
    var alive = S.players.filter(function (p) { return p.lives > 0; });
    if (alive.length <= 1) { S.phase = "end"; S.win = alive[0] ? alive[0].id : null; broadcast(); return; }
    broadcast();
    MP.t.push(setTimeout(function () { if (!MP.dead && MP.S.phase === "play") newRound(S.turn); }, 2200));
  }

  /* ---- megjelenítés ---- */
  function plistHtml(S) {
    return S.players.map(function (p) { return '<div class="pl">' + subSvg(p.col, 52) + '<b>' + esc(p.name) + (p.id === MP.me ? " (te)" : "") + '</b>' + (p.id === S.host ? '<span class="tag">host</span>' : "") + '</div>'; }).join("");
  }
  function waitingHtml() {
    return '<h2>Csatlakozás…</h2><div class="hint">' + (MP.waitFail ? "Nem található ilyen szoba, vagy a host még nincs bent. Ellenőrizd a kódot." : "Várakozás a szobára…") + '</div><br><button class="btn ghost" id="mpexit">Mégse</button>';
  }
  function lobbyHtml(S) {
    var n = S.players.length;
    return '<div class="meta"><span>Szoba</span><span>' + n + ' / ' + SEATS + ' játékos</span></div><div class="codebig">' + esc(S.code) + '</div><div class="hint center">Add meg a kódot a barátaidnak: nyissák meg az oldalt, válasszák a Gömbhal-partit, és a Csatlakozást.</div><div class="plist">' + plistHtml(S) + '</div>' +
      (MP.host ? '<div class="row"><button class="btn" id="mpstart"' + (n < 2 ? " disabled" : "") + '>Indítás</button><button class="btn ghost" id="mpexit">Kilépés</button></div>' + (n < 2 ? '<div class="hint">Legalább 2 játékos kell az induláshoz.</div>' : "")
        : '<div class="hint">Várakozás, amíg a host elindítja a játékot…</div><br><button class="btn ghost" id="mpexit">Kilépés</button>');
  }
  function playHtml(S) {
    var n = S.players.length, cur = S.players[S.turn] || {};
    var seats = S.players.map(function (p, i) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n, x = 50 + 40 * Math.cos(a), y = 50 + 37 * Math.sin(a);
      return '<div class="seat' + (i === S.turn && !S.wait ? " act" : "") + (p.lives <= 0 ? " dead" : "") + '" style="left:' + x + '%;top:' + y + '%">' + subSvg(p.col, 56) + '<span class="nm">' + esc(p.name) + (p.id === MP.me ? " ★" : "") + '</span><span>' + hearts(p.lives) + '</span></div>';
    }).join("");
    var myTurn = cur.id === MP.me && !S.wait, ev = S.ev, evHtml = "";
    if (ev) {
      if (ev.k === "ok") evHtml = '<span style="color:var(--ok)">✓ ' + esc(ev.t) + ' · ' + esc(ev.ico || "") + ' ' + esc(ev.tier || "") + '</span>';
      else if (ev.k === "boom") evHtml = '<span style="color:var(--bad)">💥 ' + esc(ev.t) + ' mellett kipukkadt a gömbhal! −1 élet' + (ev.out ? " (kiesett)" : "") + '</span>';
      else if (ev.pid === MP.me) evHtml = '<span style="color:var(--bad)">' + (ev.k === "dup" ? "Ez már elhangzott ebben a körben!" : "„" + esc(ev.t) + "” nem jó, vagy nincs a listámban. Próbálj másikat!") + '</span>';
    }
    var spectator = !S.players.some(function (p) { return p.id === MP.me; });
    var turnLine = myTurn ? '<div class="row"><input id="mpin" autocomplete="off" autocapitalize="off" placeholder="Te jössz! Írd be a válaszod…"><button class="btn" id="mpsend">Küldés</button></div>'
      : '<div class="hint center">' + (S.wait ? "Következő kör hamarosan…" : esc(cur.name || "") + " következik…") + (spectator ? " (nézőként követed)" : "") + '</div>';
    return '<div class="meta"><span>Szoba ' + esc(S.code) + ' · ' + S.round + '. kör</span><span id="mptt"></span></div><div class="timer"><i id="mptb"></i></div><h2 style="margin:10px 0 0">' + esc(S.prompt) + '</h2><div class="ringw">' + seats + '<div class="puff" id="mppuff" style="font-size:' + Math.min(5.5, 2.6 + 0.28 * S.pass) + 'rem">🐡</div></div><div class="evl">' + evHtml + '</div>' + turnLine +
      '<div class="used">' + S.used.map(function (u) { return "<span>" + esc(u) + "</span>"; }).join("") + '</div><br><button class="btn ghost" id="mpexit" style="padding:6px 12px;font-size:.85rem">Kilépés</button>';
  }
  function endHtml(S) {
    var w = S.players.filter(function (p) { return p.id === S.win; })[0];
    var rank = S.players.slice().sort(function (a, b) { return b.lives - a.lives; });
    return '<div class="center"><div style="font-size:3rem">🏆</div><h2 style="margin:6px 0">' + (w ? esc(w.name) + " nyert!" : "Döntetlen") + '</h2></div><div class="plist">' +
      rank.map(function (p) { return '<div class="pl">' + subSvg(p.col, 52) + '<b>' + esc(p.name) + (p.id === MP.me ? " (te)" : "") + '</b><span>' + hearts(p.lives) + '</span></div>'; }).join("") +
      '</div><div class="row">' + (MP.host ? '<button class="btn" id="mpagain">Új parti</button>' : "") + '<button class="btn ghost" id="mpexit">Kilépés</button></div>' + (MP.host ? "" : '<div class="hint">A host újraindíthatja a játékot.</div>');
  }
  function mpSend() {
    var el = document.getElementById("mpin");
    if (!el || !MP.room) return;
    var v = el.value.trim(); if (!v) return;
    el.value = ""; MP.room.emit("ans", { t: v }).catch(function () {}); el.focus();
  }
  function mpRender() {
    if (MP.dead) return;
    var S = MP.S;
    var sig = JSON.stringify(S, function (k, v) { return k === "tl" ? 0 : v; }) + "|" + MP.me + "|" + MP.waitFail;
    if (sig === MP.sig) return;
    MP.sig = sig;
    var el = document.getElementById("mpin"), val = el ? el.value : "";
    card.innerHTML = !S ? waitingHtml() : S.phase === "lobby" ? lobbyHtml(S) : S.phase === "play" ? playHtml(S) : endHtml(S);
    var g = function (id) { return document.getElementById(id); };
    if (g("mpexit")) g("mpexit").onclick = function () { mpLeave(); mpMenu(); };
    if (g("mpstart")) g("mpstart").onclick = hostStart;
    if (g("mpagain")) g("mpagain").onclick = hostReset;
    if (g("mpsend")) g("mpsend").onclick = mpSend;
    var inp = g("mpin");
    if (inp) { inp.value = val; inp.addEventListener("keydown", function (e) { if (e.key === "Enter") mpSend(); }); inp.focus(); }
  }
  function tick() {
    if (MP.dead) return;
    var S = MP.S;
    if (!S) { if (!MP.waitFail && Date.now() - MP.joinAt > 8000) { MP.waitFail = true; mpRender(); } return; }
    if (S.phase !== "play") return;
    var tb = document.getElementById("mptb"); if (!tb) return;
    var left = S.wait ? 0 : Math.max(0, S.tl - (performance.now() - MP.recvAt));
    tb.style.width = (S.tm ? left / S.tm * 100 : 0) + "%"; tb.className = left < 3000 ? "low" : "";
    var tt = document.getElementById("mptt"); if (tt) tt.textContent = Math.ceil(left / 1000) + " mp";
    var pf = document.getElementById("mppuff"); if (pf) pf.style.setProperty("--pp", (0.25 + 0.95 * (S.tm ? left / S.tm : 1)) + "s");
  }

  /* ======== HÁTTÉR: élő víz alatti jelenet ======== */
  var FLOW = 0;
  (function bgScene() {
    var cv = document.getElementById("bg"), g = cv.getContext("2d"), W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2), R = Math.random, snow = [], fish = [], jel = [], i;
    function size() { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
    size(); addEventListener("resize", size);
    for (i = 0; i < 110; i++) snow.push({ x: R(), y: R(), z: .3 + R() * .9, p: R() * 6.28 });
    for (i = 0; i < 7; i++) fish.push({ x: R(), y: .15 + R() * .7, v: (.01 + R() * .03) * (R() < .5 ? -1 : 1), s: 10 + R() * 22, p: R() * 6.28 });
    for (i = 0; i < 6; i++) jel.push({ x: R(), y: .3 + R() * .6, s: 14 + R() * 20, p: R() * 6.28, c: i % 2 ? "255,95,162" : "76,201,240" });
    var last = performance.now();
    function loop(now) {
      var dt = Math.min(.05, (now - last) / 1000); last = now;
      var d = parseFloat(document.documentElement.style.getPropertyValue("--d")) || 0, sil = "rgba(2,16,32," + (.28 + d * .1) + ")";
      FLOW *= Math.pow(.02, dt);
      g.clearRect(0, 0, W, H);
      var ra = (1 - d) * .16;
      if (ra > .005) for (i = 0; i < 6; i++) {
        var x0 = W * (.1 + i * .17) + Math.sin(now / 3000 + i) * 40, w = 50 + (i % 3) * 30, lg = g.createLinearGradient(0, 0, 0, H * .85);
        lg.addColorStop(0, "rgba(190,240,255," + ra + ")"); lg.addColorStop(1, "rgba(190,240,255,0)");
        g.fillStyle = lg; g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0 + w, 0); g.lineTo(x0 + w * 3 - 120, H * .85); g.lineTo(x0 - w * 2 - 60, H * .85); g.fill();
      }
      g.fillStyle = sil;
      fish.forEach(function (f) {
        f.x += f.v * dt; if (f.x > 1.1) f.x = -.1; if (f.x < -.1) f.x = 1.1;
        var x = f.x * W, y = f.y * H + Math.sin(now / 900 + f.p) * 8, s = f.s, dir = f.v > 0 ? 1 : -1;
        g.beginPath(); g.ellipse(x, y, s, s * .42, 0, 0, 6.3); g.fill();
        g.beginPath(); g.moveTo(x - dir * s * .9, y); g.lineTo(x - dir * s * 1.5, y - s * .4); g.lineTo(x - dir * s * 1.5, y + s * .4); g.fill();
      });
      if (d > .12) jel.forEach(function (j) {
        var y = (j.y * H - now * .006 * (1 + FLOW * 3)) % (H + 60); if (y < -40) y += H + 80;
        var x = j.x * W + Math.sin(now / 1500 + j.p) * 24, a = Math.min(.8, d * 1.1) * (.55 + .45 * Math.sin(now / 700 + j.p));
        var rg = g.createRadialGradient(x, y, 0, x, y, j.s * 2); rg.addColorStop(0, "rgba(" + j.c + "," + a + ")"); rg.addColorStop(1, "rgba(" + j.c + ",0)");
        g.fillStyle = rg; g.beginPath(); g.arc(x, y, j.s * 2, 0, 6.3); g.fill();
      });
      snow.forEach(function (s) {
        s.y -= dt * (.012 + .03 * s.z) * (1 + FLOW * 14); if (s.y < -.02) { s.y = 1.02; s.x = R(); }
        var x = s.x * W + Math.sin(now / 1200 + s.p) * 10 * s.z, y = s.y * H, len = FLOW * 26 * s.z;
        g.strokeStyle = "rgba(220,245,255," + (.15 + .45 * s.z) * (1 - d * .2) + ")"; g.lineWidth = s.z * 1.8;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + len + 1); g.stroke();
      });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();

  // buborékok
  for (var b = 0; b < 14; b++) {
    var el = document.createElement("div"); el.className = "bub";
    var s = 6 + Math.random() * 16;
    el.style.cssText = "width:" + s + "px;height:" + s + "px;left:" + Math.random() * 100 + "%;animation-duration:" + (9 + Math.random() * 14) + "s;animation-delay:-" + Math.random() * 20 + "s";
    document.body.appendChild(el);
  }
  document.getElementById("home").onclick = function () { clearInterval(timerId); mpLeave(); start(); };
  start();
})();
</script>
</body>
</html>
