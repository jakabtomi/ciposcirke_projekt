<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Naprendszer – 3D</title>
<style>
:root{--bg:#030614;--fg:#e9edff;--muted:#93a0d6;--panel:rgba(10,15,42,.75);--line:#232d6b;--chip:#1a2366;--accent:#4458d8;--stat:#131b4a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;cursor:grab}
#scene canvas{display:block}
.title{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:22px;pointer-events:none;max-width:340px}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;background:#1a2260cc;color:#a9b6ff;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.title h1{font-size:clamp(1.7rem,4vw,2.7rem);letter-spacing:-.03em;margin-top:8px}
.title em{font-style:normal;background:linear-gradient(90deg,#ffd36b,#ff7ab8,#7a8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{margin-top:6px;color:var(--muted);font-size:.86rem}
.panel{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:18px}
.info{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:18px;width:320px}
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.info h2{font-size:1.6rem}
.badge{display:inline-block;margin:6px 0 10px;padding:2px 12px;border-radius:999px;background:#1c2766;color:#a9b6ff;font-size:.8rem}
.fact{color:#c3cbee;line-height:1.5;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stat{background:var(--stat);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:.9rem}
.stat span{color:#8793c7;font-size:.72rem}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:#18215a;color:#dfe5ff;border:1px solid #2f3b8a;border-radius:10px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.btn:hover{background:#2a3694}
.speed{display:flex;flex-direction:column;font-size:.72rem;color:#8793c7;gap:2px}
.speed input{width:120px;accent-color:#7a8cff}
.dock{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:999px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);max-width:calc(100vw - 20px);overflow-x:auto}
.chip{display:flex;align-items:center;gap:6px;white-space:nowrap;background:none;border:0;color:#cfd6f2;padding:7px 12px;border-radius:999px;cursor:pointer;font-size:.86rem}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip:hover{background:var(--chip)}
.chip.on{background:var(--accent);color:#fff}
@media(max-width:820px){.info{top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));right:10px;left:10px;width:auto;max-height:40vh;overflow:auto}.title{left:14px}.title p{display:none}}
</style>
</head>
<body>
<div id="scene"></div>
<header class="title">
  <span class="pill">3D · Interaktív</span>
  <h1>A <em>Naprendszer</em></h1>
  <p>Húzd a nézetet, görgess a nagyításhoz, kattints egy bolygóra!</p>
</header>
<aside class="panel info">
  <div id="detail"></div>
  <div class="controls">
    <button class="btn" id="pause">⏸ Szünet</button>
    <label class="speed">Sebesség<input id="speed" type="range" min="0.2" max="6" step="0.1" value="1"></label>
  </div>
</aside>
<nav class="dock" id="dock"></nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var planets = [
    { name: "Merkúr", type: "Kőzetbolygó", d: 4879, moons: 0, day: "59 földi nap", year: 88, temp: "−180…430 °C", color: "#a8a8a8", fact: "A legkisebb bolygó, a Nap körüli pályáját mindössze 88 nap alatt futja be." },
    { name: "Vénusz", type: "Kőzetbolygó", d: 12104, moons: 0, day: "243 földi nap", year: 225, temp: "~465 °C", color: "#e8b96f", fact: "Az erős üvegházhatás miatt ez a Naprendszer legforróbb bolygója." },
    { name: "Föld", type: "Kőzetbolygó", d: 12742, moons: 1, day: "24 óra", year: 365, temp: "~15 °C", color: "#4a90e2", fact: "Az egyetlen ismert hely, ahol élet van. Felszínének mintegy 71%-át víz borítja." },
    { name: "Mars", type: "Kőzetbolygó", d: 6779, moons: 2, day: "24,6 óra", year: 687, temp: "~−63 °C", color: "#d1502a", fact: "Itt található a Naprendszer legnagyobb vulkánja, az Olympus Mons." },
    { name: "Jupiter", type: "Gázóriás", d: 139820, moons: 95, day: "10 óra", year: 4333, temp: "~−110 °C", color: "#d9a66c", fact: "A Nagy Vörös Folt egy több száz éve tartó óriási vihar, nagyobb, mint a Föld." },
    { name: "Szaturnusz", type: "Gázóriás", d: 116460, moons: 146, day: "10,7 óra", year: 10759, temp: "~−140 °C", color: "#ead594", fact: "Átlagsűrűsége kisebb a vízénél, így elméletileg úszna egy elég nagy óceánon." },
    { name: "Uránusz", type: "Jégóriás", d: 50724, moons: 28, day: "17 óra", year: 30687, temp: "~−195 °C", color: "#7fd8da", fact: "Az oldalán fekve kering a Nap körül, tengelyferdesége közel 98°." },
    { name: "Neptunusz", type: "Jégóriás", d: 49244, moons: 16, day: "16 óra", year: 60190, temp: "~−200 °C", color: "#4466e8", fact: "A Naprendszer legerősebb szelei itt fújnak, akár 2000 km/h sebességgel." }
  ];
  var sizeOf = function (p) { return 0.5 + Math.pow(p.d / 12742, 0.4) * 0.8; };
  var distOf = function (i) { return 16 + i * 9; };
  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var fmt = function (n) { return n.toLocaleString("hu-HU"); };

  function planetTexture(p) {
    var c = document.createElement("canvas"); c.width = 512; c.height = 256;
    var g = c.getContext("2d"); g.fillStyle = p.color; g.fillRect(0, 0, 512, 256);
    var i;
    if (p.type !== "Kőzetbolygó") {
      for (var y = 0; y < 256; y += rnd(4, 14)) {
        g.fillStyle = Math.random() > 0.5 ? "rgba(255,255,255," + rnd(0.04, 0.18) + ")" : "rgba(0,0,0," + rnd(0.05, 0.2) + ")";
        g.fillRect(0, y, 512, rnd(3, 12));
      }
    } else if (p.name === "Föld") {
      g.fillStyle = "#3f9b4f";
      for (i = 0; i < 14; i++) { g.beginPath(); g.ellipse(rnd(0, 512), rnd(50, 200), rnd(15, 55), rnd(8, 30), rnd(0, 3), 0, 6.28); g.fill(); }
      g.fillStyle = "rgba(255,255,255,.85)"; g.fillRect(0, 0, 512, 14); g.fillRect(0, 242, 512, 14);
      g.fillStyle = "rgba(255,255,255,.18)";
      for (i = 0; i < 20; i++) { g.beginPath(); g.ellipse(rnd(0, 512), rnd(0, 256), rnd(20, 60), rnd(4, 10), 0, 0, 6.28); g.fill(); }
    } else {
      for (i = 0; i < 160; i++) { g.fillStyle = "rgba(0,0,0," + rnd(0.05, 0.25) + ")"; g.beginPath(); g.arc(rnd(0, 512), rnd(0, 256), rnd(2, 14), 0, 6.28); g.fill(); }
    }
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function glowTexture() {
    var c = document.createElement("canvas"); c.width = c.height = 256;
    var g = c.getContext("2d");
    var gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, "rgba(255,240,170,1)"); gr.addColorStop(0.25, "rgba(255,170,40,.55)"); gr.addColorStop(1, "rgba(255,120,0,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  }

  /* ---------- UI állapot ---------- */
  var selected = 2, paused = false, speed = 1;
  var detail = document.getElementById("detail");
  var dock = document.getElementById("dock");
  var chips = [];

  function addChip(label, color, idx) {
    var b = document.createElement("button");
    b.className = "chip";
    if (color) { var i = document.createElement("i"); i.style.background = color; b.appendChild(i); }
    b.appendChild(document.createTextNode(label));
    b.addEventListener("click", function () { select(idx); });
    dock.appendChild(b); chips.push(b);
  }
  addChip("☀ Áttekintés", null, null);
  planets.forEach(function (p, i) { addChip(p.name, p.color, i); });

  function select(i) {
    selected = i;
    chips.forEach(function (c, k) { c.classList.toggle("on", (i === null ? 0 : i + 1) === k); });
    if (i === null) {
      detail.innerHTML = '<div class="fade"><h2>Áttekintés</h2><p class="fact">Válassz egy bolygót az alsó sávból, vagy kattints rá közvetlenül a 3D térben. A kamera odarepül, és követi a keringését.</p></div><br>';
      return;
    }
    var p = planets[i];
    detail.innerHTML = '<div class="fade"><h2>' + p.name + '</h2><span class="badge">' + p.type + '</span><p class="fact">' + p.fact + '</p><div class="stats">' +
      '<div class="stat"><b>' + fmt(p.d) + ' km</b><span>Átmérő</span></div>' +
      '<div class="stat"><b>' + p.moons + '</b><span>Ismert hold</span></div>' +
      '<div class="stat"><b>' + p.day + '</b><span>Egy nap</span></div>' +
      '<div class="stat"><b>' + fmt(p.year) + ' nap</b><span>Egy év</span></div>' +
      '<div class="stat"><b>' + p.temp + '</b><span>Hőmérséklet</span></div>' +
      '<div class="stat"><b>' + (p.d / 12742).toFixed(2).replace(".", ",") + '×</b><span>A Földhöz képest</span></div></div></div>';
  }
  select(2);

  var pauseBtn = document.getElementById("pause");
  pauseBtn.addEventListener("click", function () { paused = !paused; pauseBtn.textContent = paused ? "▶ Indítás" : "⏸ Szünet"; });
  document.getElementById("speed").addEventListener("input", function (e) { speed = Number(e.target.value); });
  addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") select(((selected === null ? -1 : selected) + 1) % 8);
    if (e.key === "ArrowLeft") select(((selected === null ? 0 : selected) + 7) % 8);
    if (e.key === "Escape") select(null);
  });

  /* ---------- 3D ---------- */
  var mount = document.getElementById("scene");
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(0, 55, 95);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  mount.appendChild(renderer.domElement);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.minDistance = 2; controls.maxDistance = 220;

  var sp = [];
  for (var s = 0; s < 2500; s++) {
    var v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(300 + Math.random() * 200);
    sp.push(v.x, v.y, v.z);
  }
  var sg = new THREE.BufferGeometry();
  sg.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, sizeAttenuation: false })));

  scene.add(new THREE.AmbientLight(0x6070a0, 0.6));
  scene.add(new THREE.PointLight(0xfff0cc, 1.6, 0, 0));
  var sun = new THREE.Mesh(new THREE.SphereGeometry(6, 48, 48), new THREE.MeshBasicMaterial({ color: 0xffc23d }));
  scene.add(sun);
  var glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  glow.scale.set(34, 34, 1); scene.add(glow);

  var groups = [], meshes = [], angles = planets.map(function (_, i) { return i * 1.3; });
  planets.forEach(function (p, i) {
    var r = distOf(i), pts = [];
    for (var k = 0; k <= 128; k++) pts.push(new THREE.Vector3(Math.cos(k / 128 * 6.2832) * r, 0, Math.sin(k / 128 * 6.2832) * r));
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x3a4aa8, transparent: true, opacity: 0.45 })));
    var sz = sizeOf(p), group = new THREE.Group();
    var mesh = new THREE.Mesh(new THREE.SphereGeometry(sz, 48, 48), new THREE.MeshStandardMaterial({ map: planetTexture(p), roughness: 0.9, metalness: 0 }));
    group.add(mesh);
    if (p.name === "Szaturnusz") {
      var ring = new THREE.Mesh(new THREE.RingGeometry(sz * 1.4, sz * 2.4, 96), new THREE.MeshBasicMaterial({ color: 0xcdb97a, side: THREE.DoubleSide, transparent: true, opacity: 0.7 }));
      ring.rotation.x = Math.PI / 2 - 0.45; group.add(ring);
    }
    if (p.name === "Uránusz") group.rotation.z = 1.7;
    scene.add(group); groups.push(group); meshes.push(mesh);
  });

  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), down = { x: 0, y: 0 }, el = renderer.domElement;
  function pick(e) {
    var b = el.getBoundingClientRect();
    ndc.set((e.clientX - b.left) / b.width * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hit = ray.intersectObjects(meshes)[0];
    return hit ? hit.object : null;
  }
  el.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY }; });
  el.addEventListener("pointerup", function (e) {
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) return;
    var h = pick(e); if (h) select(meshes.indexOf(h));
  });
  el.addEventListener("pointermove", function (e) { el.style.cursor = pick(e) ? "pointer" : "grab"; });
  addEventListener("resize", function () {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  });

  var clock = new THREE.Clock(), tmp = new THREE.Vector3();
  (function loop() {
    var dt = Math.min(clock.getDelta(), 0.1);
    if (!paused) {
      planets.forEach(function (p, i) {
        angles[i] += (0.35 / Math.sqrt(p.year / 88)) * dt * speed;
        meshes[i].rotation.y += dt * 0.6 * speed;
      });
      sun.rotation.y += dt * 0.1;
    }
    planets.forEach(function (_, i) { groups[i].position.set(Math.cos(angles[i]) * distOf(i), 0, Math.sin(angles[i]) * distOf(i)); });
    var goal = selected === null ? tmp.set(0, 0, 0) : tmp.copy(groups[selected].position);
    var offset = camera.position.clone().sub(controls.target);
    var want = selected === null ? 110 : sizeOf(planets[selected]) * 5 + 3;
    if (selected === null || offset.length() > want * 1.02 || offset.length() < want * 0.5) {
      offset.setLength(THREE.MathUtils.lerp(offset.length(), want, 0.04));
    }
    controls.target.lerp(goal, 0.08);
    camera.position.copy(controls.target).add(offset);
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
